<p-toast></p-toast>

<div class="login-page">

  <!-- Fixed Banner -->
  <div class="top-banner">
    <div class="glow-node node-1"></div>
    <div class="glow-node node-2"></div>
    <div class="glow-node node-3"></div>
  </div>

  <!-- Background Floating Shapes in White Space -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>
  <div class="bg-shape shape-3"></div>

  <!-- Scrollable Content -->
  <div class="content-section">
    <!-- Brand -->
    <div class="brand-section animate-item">
      <h1>EWS Platform</h1>
      <p>EARLY WARNING SIGNAL SYSTEM — RSSB BANK</p>
    </div>

    <!-- Login Card -->
    <div class="login-wrapper">
      <div class="login-card animate-item delay-1">
        <h2>Login to Your Account</h2>

        <div class="company-name">EWS Module Access</div>

        <div class="divider"></div>

        <div>
          <p class="login-text">Login to start your session!</p>

          <form #loginForm="ngForm" (ngSubmit)="login()" autocomplete="off">
            <!-- Employee Code -->
            <div class="input-group animate-item delay-2">
              <label for="username">Employee Code</label>

              <input
                id="username"
                pInputText
                type="text"
                [(ngModel)]="username"
                name="username"
                placeholder="Enter Employee Code"
                class="w-full custom-input"
                required
                autocomplete="username"
              />
            </div>

            <!-- Password -->
            <div class="input-group animate-item delay-3">
              <label for="password">Password</label>

              <p-password
                inputId="password"
                [(ngModel)]="password"
                name="password"
                [toggleMask]="true"
                [feedback]="false"
                placeholder="Enter Password"
                styleClass="w-full"
                inputStyleClass="w-full custom-input"
                autocomplete="current-password"
                required
              >
              </p-password>
            </div>

            <!-- Login Button -->
            <button
              pButton
              type="submit"
              [label]="loading() ? 'Authenticating...' : 'Login'"
              [loading]="loading()"
              [disabled]="loading() || !username || !password"
              class="login-btn animate-item delay-4"
            ></button>
          </form>

          <!-- Quick Demo Login Buttons -->
          <div class="demo-login-section animate-item delay-5">
            <div class="demo-label">
              <span class="demo-divider-line"></span>
              <span class="demo-divider-text">Quick Login</span>
              <span class="demo-divider-line"></span>
            </div>
            <div class="demo-buttons">
              <button
                *ngFor="let u of demoUsers"
                type="button"
                class="demo-btn"
                [disabled]="loading()"
                (click)="quickLogin(u.username, u.password)"
                [title]="'Login as ' + u.label"
              >
                <i [class]="u.icon"></i>
                <span>{{ u.label }}</span>
              </button>
            </div>
            <p class="demo-hint">
              <kbd>Ctrl</kbd><span>+</span><kbd>K</kbd> &rarr; Login as Admin
            </p>
          </div>

          <!-- Language Toggle -->
          <div class="lang-toggle-row animate-item delay-5">
            <button
              type="button"
              class="lang-pill"
              [class.active]="selectedLanguage === 'en'"
              (click)="onLanguageChange('en')"
            >English</button>
            <button
              type="button"
              class="lang-pill"
              [class.active]="selectedLanguage === 'mr'"
              (click)="onLanguageChange('mr')"
            >मराठी</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
